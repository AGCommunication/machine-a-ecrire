<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine à écrire</title>
<meta name="description" content="Un éditeur de texte des plus sobres, au ressenti machine à écrire.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 0 36 40' fill='none' stroke='%238c3b2e' stroke-width='3.4' stroke-linecap='round'%3E%3Cpath d='M4.5 5Q12 6 12 13V17'/%3E%3Cpath d='M19.5 5Q12 6 12 13'/%3E%3Cpath d='M6 22H18'/%3E%3Cpath d='M12 22V28'/%3E%3Cpath d='M4.5 35Q12 34 12 27'/%3E%3Cpath d='M19.5 35Q12 34 12 27'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <div id="mover">
    <div id="doc"><div id="caret" aria-hidden="true"></div></div>
  </div>
</div>

<div id="meas" class="sheet-text" aria-hidden="true"></div>

<textarea id="ta" spellcheck="false" autocomplete="off" autocorrect="off"
          autocapitalize="off" aria-label="Feuille"></textarea>

<div id="rail" aria-hidden="true"><div id="rail-marker"></div></div>

<div id="scrim"></div>

<aside id="panel" aria-hidden="true">
  <h1>Feuilles</h1>
  <button id="new-sheet" type="button">+ nouvelle feuille</button>
  <ul id="sheet-list"></ul>
  <footer>
    <div id="bgs">
      <span class="lbl">fond</span>
      <button type="button" class="bg-dot d-bureau" data-bg="bureau" title="bureau"></button>
      <button type="button" class="bg-dot d-aube" data-bg="aube" title="aube"></button>
      <button type="button" class="bg-dot d-lagune" data-bg="lagune" title="lagune"></button>
      <button type="button" class="bg-dot d-tapisserie" data-bg="tapisserie" title="tapisserie"></button>
      <button type="button" class="bg-dot d-lettres" data-bg="lettres" title="lettres"></button>
      <button type="button" class="bg-dot d-steampunk" data-bg="steampunk" title="steampunk"></button>
    </div>
    <button id="tgl-strict" type="button" class="opt"
            title="marge butée, retour chariot manuel, pas d'effacement : on corrige en surfrappant"></button>
    <button id="tgl-keys" type="button" class="opt"></button>
    <button id="tgl-carriage" type="button" class="opt"></button>
    <button id="blanco" type="button" class="opt"
            title="sélectionnez ensuite le texte à couvrir ; Échap pour renoncer">poser du blanco</button>
    <button id="print-pdf" type="button" class="opt">imprimer / PDF</button>
    <button id="export" type="button" class="opt">exporter la feuille (.txt)</button>
  </footer>
</aside>

<div id="print-root" class="sheet-text" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
