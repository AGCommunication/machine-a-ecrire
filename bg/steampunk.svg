        <rect x="-5" y="-2.6" width="9" height="5.2" rx="1"/>
        <rect x="4" y="-2" width="8" height="4" rx="1"/>
        <path d="M12,-2 V2"/>
      </g>
    </g>
    <g id="flask">
      <path d="M-2.2,-11 H2.2 M-2.2,-11 V-4 L-8.2,7.5 Q-9.4,10 -7,10 H7 Q9.4,10 8.2,7.5 L2.2,-4 V-11"/>
      <path d="M-5,4 H5"/>
      <circle cx="1.5" cy="0" r=".8"/>
    </g>
    <g id="monocle">
      <circle r="7"/>
      <path d="M5,5 Q9,11 6.5,15.5"/>
      <circle cx="6.2" cy="17" r="1.3"/>
    </g>
    <g id="cogS">
      <g stroke-linecap="round">
        <line y1="-4.5" y2="-7"/><line y1="4.5" y2="7"/>
        <line x1="-4.5" x2="-7"/><line x1="4.5" x2="7"/>
        <line x1="-3.2" y1="-3.2" x2="-5" y2="-5"/><line x1="3.2" y1="3.2" x2="5" y2="5"/>
      </g>
      <circle r="4.5"/><circle r="1.1"/>
    </g>
    <g id="rivet">
      <path d="M0,-4.6 L4,-2.3 V2.3 L0,4.6 L-4,2.3 V-2.3 Z"/>
      <circle r="1.2"/>
    </g>
    <g id="star4">
      <path d="M0,-5 L1.1,-1.1 L5,0 L1.1,1.1 L0,5 L-1.1,1.1 L-5,0 L-1.1,-1.1 Z"/>
    </g>
    <g id="dots3" fill="currentColor" stroke="none">
      <circle cx="-4" r="1"/><circle cx="0" cy="-3" r="1"/><circle cx="4" r="1"/>
    </g>
