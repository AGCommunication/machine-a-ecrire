<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460">
  <defs>
    <g id="gear">
      <g stroke-linecap="round">
        <line x1="0" y1="-10" x2="0" y2="-13.5"/><line x1="0" y1="10" x2="0" y2="13.5"/>
        <line x1="-10" y1="0" x2="-13.5" y2="0"/><line x1="10" y1="0" x2="13.5" y2="0"/>
        <line x1="-7.1" y1="-7.1" x2="-9.5" y2="-9.5"/><line x1="7.1" y1="-7.1" x2="9.5" y2="-9.5"/>
        <line x1="-7.1" y1="7.1" x2="-9.5" y2="9.5"/><line x1="7.1" y1="7.1" x2="9.5" y2="9.5"/>
      </g>
      <circle r="9.5"/><circle r="3.5"/>
    </g>
    <g id="tophat">
      <path d="M-15,9 Q0,13 15,9"/>
      <path d="M-9,9.8 V-9 Q-9,-12 -6,-12 H6 Q9,-12 9,-9 V9.8"/>
      <path d="M-9,2.5 H9"/>
    </g>
    <g id="watch">
      <circle r="11"/><circle r="7.8"/>
      <path d="M0,0 V-5 M0,0 L3.4,2"/>
      <path d="M-1.6,-13.2 H1.6 M0,-13.2 V-11"/>
      <circle cy="-15.4" r="2"/>
    </g>
    <g id="dirigeable">
      <ellipse rx="16.5" ry="6.3"/>
      <path d="M14,-3.4 L21,-7.5 V7.5 L14,3.4"/>
      <path d="M-3,6.2 L-2,10.5 H4 L5,6.2 M-1,6.2 V10.5 M3,6.2 V10.5"/>
      <path d="M-9.5,-5 Q-11,0 -9.5,5"/>
    </g>
    <g id="goggles">
      <circle cx="-7.5" r="6"/><circle cx="7.5" r="6"/>
      <path d="M-1.5,0 H1.5 M-13.5,0 H-19 M13.5,0 H19"/>
    </g>
    <g id="key">
      <circle cx="-8" r="4.5"/>
      <path d="M-3.5,0 H12 M8,0 V4.5 M12,0 V5.5"/>
    </g>
    <g id="balloon">
      <circle cy="-6" r="9.2"/>
      <path d="M0,-15.2 Q-4.5,-6 0,3 M0,-15.2 Q4.5,-6 0,3"/>
      <path d="M-6.4,0.4 L-3.4,8 M6.4,0.4 L3.4,8"/>
      <rect x="-3.8" y="8" width="7.6" height="5" rx="1.2"/>
    </g>
    <g id="compass">
      <circle r="10"/>
      <path d="M0,-6 L2.6,0 L0,6 L-2.6,0 Z"/>
      <path d="M0,-10 V-13"/>
    </g>
    <g id="candle">
      <rect x="-3" y="-6" width="6" height="12.5" rx="1"/>
      <path d="M0,-9 Q2.6,-12.5 0,-16 Q-2.6,-12.5 0,-9"/>
      <path d="M-6.5,6.5 H6.5 Q7.5,8.3 5.5,9.3 H-5.5 Q-7.5,8.3 -6.5,6.5"/>
    </g>
    <g id="typewriter">
      <rect x="-12" y="1.5" width="24" height="7" rx="2"/>
      <path d="M-8,1.5 V-4 H8 V1.5"/>
      <path d="M-4.5,-4 V-11 H4.5 V-4"/>
      <g fill="currentColor" stroke="none">
        <circle cx="-7" cy="5" r=".95"/><circle cx="-3.5" cy="5" r=".95"/>
        <circle cx="0" cy="5" r=".95"/><circle cx="3.5" cy="5" r=".95"/><circle cx="7" cy="5" r=".95"/>
      </g>
    </g>
    <g id="pipe">
