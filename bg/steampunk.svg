  <g fill="none" stroke="#c9bca8" stroke-width="1.3" color="#c9bca8">
    <use href="#gear"       transform="translate(55,55)"/>
    <use href="#tophat"     transform="translate(160,55)"/>
    <use href="#dirigeable" transform="translate(268,57)"/>
    <use href="#watch"      transform="translate(370,56)"/>

    <use href="#key"        transform="translate(107,165) rotate(-18)"/>
    <use href="#balloon"    transform="translate(212,163)"/>
    <use href="#goggles"    transform="translate(318,165)"/>
    <use href="#compass"    transform="translate(26,168)"/>

    <use href="#typewriter" transform="translate(55,275)"/>
    <use href="#candle"     transform="translate(160,274)"/>
    <use href="#pipe"       transform="translate(266,273)"/>
    <use href="#book"       transform="translate(370,275)"/>

    <use href="#telescope"  transform="translate(107,388)"/>
    <use href="#flask"      transform="translate(212,386)"/>
    <use href="#monocle"    transform="translate(316,383)"/>
    <use href="#gear"       transform="translate(412,390) scale(.8)"/>

    <use href="#cogS"   transform="translate(108,104)"/>
    <use href="#star4"  transform="translate(214,108)"/>
    <use href="#rivet"  transform="translate(319,106)"/>
    <use href="#dots3"  transform="translate(22,98)"/>
    <use href="#star4"  transform="translate(58,214)"/>
    <use href="#rivet"  transform="translate(162,217)"/>
    <use href="#cogS"   transform="translate(267,219)"/>
    <use href="#star4"  transform="translate(372,216)"/>
    <use href="#rivet"  transform="translate(108,330)"/>
    <use href="#cogS"   transform="translate(213,332) rotate(20)"/>
    <use href="#star4"  transform="translate(318,329)"/>
    <use href="#dots3"  transform="translate(400,335)"/>
    <use href="#star4"  transform="translate(55,440)"/>
    <use href="#dots3"  transform="translate(160,443)"/>
    <use href="#rivet"  transform="translate(266,441)"/>
    <use href="#star4"  transform="translate(370,444)"/>
    <use href="#rivet"  transform="translate(22,22)"/>
    <use href="#star4"  transform="translate(214,20)"/>
    <use href="#cogS"   transform="translate(395,20) scale(.85)"/>
    <use href="#dots3"  transform="translate(110,20)"/>
  </g>
</svg>
